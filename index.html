    <!--
      Mesure d'audience, sans cookie, respectueuse de la vie privee (Cloudflare Web

      sur https://dash.cloudflare.com -> Analytics -> Web Analytics -> ajouter ce site ->
      copier le "beacon token" fourni et remplacer REMPLACER-PAR-TON-TOKEN ci-dessous. Tant que
      le token n'est pas renseigne, ce script ne fait rien (401 silencieux, pas d'erreur
      visible, pas de tracking).
    -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "REMPLACER-PAR-TON-TOKEN"}'></script>
